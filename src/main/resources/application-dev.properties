spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

file.upload-directory=${FILE_UPLOAD_DIR}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

vps.host=${VPS_HOST}
vps.port=${VPS_PORT}
vps.username=${VPS_USERNAME}
vps.password=${VPS_PASSWORD}
vps.base-path=${VPS_BASE_PATH}
vps.base-url=${VPS_BASE_URL}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}
jwt.verification.expiration=${JWT_VERIFICATION_EXPIRATION}

app.name=${APP_NAME}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

app.frontend.url=${FRONTEND_URL}
app.base-url=${APP_BASE_URL}
app.api-url=${APP_API_URL}

logging.level.org.springframework.security=DEBUG
logging.level.com.masasilam.app=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.org.apache.ibatis=DEBUG